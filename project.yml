name: WorkSlop
options:
  bundleIdPrefix: com.adnan120hz
  deploymentTarget:
    iOS: "16.0"
targets:
  WorkSlop:
    type: application
    platform: iOS
    info:
      path: WorkSlop/Info.plist
      properties:
        CFBundleName: WorkSlop
        CFBundleDisplayName: WorkSlop
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.adnan120hz.workslop.tendies
            UTTypeDescription: PosterBoard tendies package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - tendies
          - UTTypeIdentifier: com.adnan120hz.workslop.batter
            UTTypeDescription: PosterBoard batter template
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - batter
        CFBundleIcons:
          CFBundleAlternateIcons:
            IconPurple:
              CFBundleIconFiles:
                - IconPurple
            IconBlue:
              CFBundleIconFiles:
                - IconBlue
            IconGray:
              CFBundleIconFiles:
                - IconGray
    sources:
      - path: WorkSlop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan120hz.workslop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "14.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  WorkSlopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WorkSlopUITests
    dependencies:
      - target: WorkSlop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan120hz.workslop.uitests
