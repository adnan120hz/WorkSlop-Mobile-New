name: Build + screenshot check

# Manual only. Builds the app, runs the UI smoke test, takes a launch
# screenshot, and packages an unsigned device IPA for sideload testing.
# Publishes nothing.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project WorkSlop.xcodeproj \
            -scheme WorkSlop \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator + screenshot smoke check
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m1 'iPhone 16' | grep -oE '[0-9A-F-]{36}')
          if [ -z "$SIM_ID" ]; then SIM_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}'); fi
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          set +e
          xcodebuild test \
            -project WorkSlop.xcodeproj \
            -scheme WorkSlop \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test-log.txt" | tail -40
          TEST_RC=${PIPESTATUS[0]}
          set -e
          xcrun simctl launch --terminate-running-process "$SIM_ID" com.adnan120hz.workslop -DemoIOS26 -uiStyle workslop || true
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot "$RUNNER_TEMP/smoke-launch.png" || true
          if [ "$TEST_RC" != "0" ]; then echo "UI smoke test failed (rc=$TEST_RC)"; exit 1; fi

      - name: Build device IPA (unsigned, for sideload testing)
        run: |
          xcodebuild build \
            -project WorkSlop.xcodeproj \
            -scheme WorkSlop \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device-build" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/device-build/Build/Products/Debug-iphoneos/WorkSlop.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry WorkSlop-unsigned.ipa Payload)
          ls -la "$RUNNER_TEMP/WorkSlop-unsigned.ipa"

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSlop-IPA
          path: ${{ runner.temp }}/WorkSlop-unsigned.ipa
          if-no-files-found: warn
