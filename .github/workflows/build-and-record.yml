name: Build IPA

# Builds the unsigned device IPA and uploads it as the ONLY artifact.
# Deliberately no screenshots, no recordings, no extra outputs.
on:
  workflow_dispatch:
    inputs:
      proof_shot:
        description: 'Also make UI screenshots (artifact only, never in repo)'
        type: boolean
        default: false
      proof_style:
        description: 'UI style for the screenshots'
        type: choice
        options: [workslop, nugget, modern]
        default: workslop

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for simulator (compile check)
        run: |
          xcodebuild -project WorkSlop.xcodeproj -scheme WorkSlop \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO

      - name: Build device IPA (unsigned, for sideload testing)
        run: |
          xcodebuild -project WorkSlop.xcodeproj \
            -scheme WorkSlop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ${{ runner.temp }}/DerivedData \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP="${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/WorkSlop.app"
          test -d "$APP"
          IPA_DIR="${{ runner.temp }}/ipa-staging"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && /usr/bin/zip -qry ${{ runner.temp }}/WorkSlop-unsigned.ipa Payload)
          ls -la ${{ runner.temp }}/WorkSlop-unsigned.ipa

      - name: Proof screenshots (on request only)
        if: ${{ inputs.proof_shot }}
        run: |
          set -euo pipefail
          xcodebuild -project WorkSlop.xcodeproj -scheme WorkSlop \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ${{ runner.temp }}/SimDD \
            build CODE_SIGNING_ALLOWED=NO
          SIM_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F-]{36}' | head -1)
          if [ -z "$SIM_ID" ]; then
            SIM_ID=$(xcrun simctl create ProofPhone com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-26-0)
          fi
          echo "Simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b || true
          APP="${{ runner.temp }}/SimDD/Build/Products/Debug-iphonesimulator/WorkSlop.app"
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl launch --terminate-running-process "$SIM_ID" com.adnan120hz.workslop -DemoIOS26 -uiStyle ${{ inputs.proof_style }} || true
          sleep 4
          xcrun simctl io "$SIM_ID" screenshot ${{ runner.temp }}/proof-home.png
          ls -la ${{ runner.temp }}/proof-home.png

      - name: Upload proof shots
        if: ${{ inputs.proof_shot }}
        uses: actions/upload-artifact@v4
        with:
          name: ProofShots
          path: ${{ runner.temp }}/proof-home.png
          if-no-files-found: warn

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorkSlop-IPA
          path: ${{ runner.temp }}/WorkSlop-unsigned.ipa
          if-no-files-found: warn
